# Codemagic 壳仓库 (build-carrier) 配置文件
# 环境变量通过 API 动态注入：
#   CODE_URL             - 源码 zip 的 CDN 下载地址
#   ARTIFACT_UPLOAD_URL  - APK 上传到 COS 的 presigned PUT URL
#   STATUS_UPLOAD_URL    - 构建状态 JSON 上传到 COS 的 presigned PUT URL
#   CHAT_ID / BUILD_TARGET - 业务参数

workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      android_signing:
        - atoms_mobile_demo
      vars:
        CODE_URL: "PLACEHOLDER"
        APP_NAME: "PLACEHOLDER"
        CHAT_ID: "PLACEHOLDER"
        BUILD_TARGET: "apk"
        ARTIFACT_UPLOAD_URL: "PLACEHOLDER"
        STATUS_UPLOAD_URL: "PLACEHOLDER"
      node: 20
      java: 17
    scripts:
      - name: Download and extract source
        script: |
          echo "Downloading source..."
          curl -fSL "$CODE_URL" -o /tmp/source.zip
          ls -lh /tmp/source.zip
          unzip -o /tmp/source.zip -d $CM_BUILD_DIR
          test -f "$CM_BUILD_DIR/package.json" || { echo "FATAL: package.json missing"; exit 1; }
          echo "Source ready."

      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          if [ -f pnpm-lock.yaml ]; then
            corepack pnpm install --frozen-lockfile
          else
            npm install
          fi

      - name: Prepare Expo config
        script: |
          cd $CM_BUILD_DIR
          ./node_modules/.bin/expo config --json > /tmp/resolved-expo.json
          node -e "
          const fs = require('fs');
          const expo = require('./scripts/apply_mobile_icon.cjs')(JSON.parse(fs.readFileSync('/tmp/resolved-expo.json', 'utf8')));
          if (!expo.android) expo.android = {};
          if (!expo.android.package) {
            const slug = (expo.slug || 'app').replace(/[^a-zA-Z0-9]/g, '');
            expo.android.package = 'com.mgx.' + slug.toLowerCase();
            console.log('Injected android.package:', expo.android.package);
          } else {
            console.log('android.package already set:', expo.android.package);
          }
          if (!expo.ios) expo.ios = {};
          if (!expo.ios.bundleIdentifier) {
            expo.ios.bundleIdentifier = expo.android.package;
          }
          fs.writeFileSync('app.json', JSON.stringify({ expo }, null, 2));
          for (const name of ['app.config.js', 'app.config.ts']) fs.rmSync(name, { force: true });
          "

      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR
          ./node_modules/.bin/expo prebuild --platform android --no-install

      - name: Configure Android release signing
        script: |
          set -eu
          : "${CM_KEYSTORE_PATH:?Missing Codemagic keystore}"
          : "${CM_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${CM_KEY_ALIAS:?Missing key alias}"
          : "${CM_KEY_PASSWORD:?Missing key password}"
          test -f "$CM_KEYSTORE_PATH"
          cd "$CM_BUILD_DIR"
          test -f android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          // Use the team keystore for release APK and AAB builds.
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('CM_KEYSTORE_PATH'))
                      storePassword System.getenv('CM_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('CM_KEY_ALIAS')
                      keyPassword System.getenv('CM_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build APK
        script: |
          cd $CM_BUILD_DIR/android
          if [ "$BUILD_TARGET" = "aab" ]; then
            ./gradlew bundleRelease
          else
            ./gradlew assembleRelease
          fi

    artifacts:
      - $CM_BUILD_DIR/android/app/build/outputs/**/*.apk
      - $CM_BUILD_DIR/android/app/build/outputs/**/*.aab

    publishing:
      scripts:
        - name: Upload results to COS
          script: |
            set +e

            STATUS="failed"
            ERROR_MSG="Build failed"
            ARTIFACT_SIZE=0

            if [ "$BUILD_TARGET" = "aab" ]; then
              ARTIFACT=$(find $CM_BUILD_DIR/android -name "*.aab" -path "*/release/*" 2>/dev/null | head -1)
              ARTIFACT_CONTENT_TYPE="application/octet-stream"
              ARTIFACT_LABEL="AAB"
            else
              ARTIFACT=$(find $CM_BUILD_DIR/android -name "*.apk" -path "*/release/*" 2>/dev/null | head -1)
              ARTIFACT_CONTENT_TYPE="application/vnd.android.package-archive"
              ARTIFACT_LABEL="APK"
            fi

            if [ -n "$ARTIFACT" ] && [ -f "$ARTIFACT" ]; then
              ARTIFACT_SIZE=$(stat -f%z "$ARTIFACT" 2>/dev/null || stat -c%s "$ARTIFACT" 2>/dev/null || echo 0)
              echo "Uploading $ARTIFACT_LABEL ($ARTIFACT_SIZE bytes): $ARTIFACT"

              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -X PUT \
                -H "Content-Type: $ARTIFACT_CONTENT_TYPE" \
                -T "$ARTIFACT" \
                "$ARTIFACT_UPLOAD_URL")

              if [ "$HTTP_CODE" = "200" ]; then
                STATUS="success"
                ERROR_MSG=""
                echo "$ARTIFACT_LABEL uploaded successfully"
              else
                ERROR_MSG="$ARTIFACT_LABEL upload to COS failed with HTTP $HTTP_CODE"
                echo "$ERROR_MSG"
              fi
            else
              ERROR_MSG="No release $ARTIFACT_LABEL found after build"
              echo "$ERROR_MSG"
            fi

            echo "{\"status\":\"$STATUS\",\"error\":\"$ERROR_MSG\",\"artifact_size\":$ARTIFACT_SIZE}" > /tmp/status.json
            echo "Status: $(cat /tmp/status.json)"

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT \
              -H "Content-Type: application/json" \
              -T /tmp/status.json \
              "$STATUS_UPLOAD_URL")

            echo "Status file uploaded: HTTP $HTTP_CODE"

  website-apk:
    name: Fixed Website Android APK or AAB
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      android_signing:
        - atoms_mobile_demo
      node: 20
      java: 17
    scripts:
      - name: Verify fixed input, compile, sign and upload Android artifact
        script: |
          set +x
          set -eu
          cd "$CM_BUILD_DIR"
          python3 scripts/build_fixed_apk.py

  ios-build:
    name: Signed App Store IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 26.3
      node: 22.14.0
      cocoapods: 1.16.2
    scripts:
      - name: Build and upload signed IPA
        script: |
          bash "$CM_BUILD_DIR/scripts/build_ipa.sh"
